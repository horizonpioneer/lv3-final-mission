spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${database.dev.url}
    username: ${database.dev.username}
    password: ${database.dev.password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    activate:
      on-profile: dev
    import:
      - submodule/infrastructure/database.yml
